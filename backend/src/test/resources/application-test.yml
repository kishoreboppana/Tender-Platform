spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/tms
    username: tms
    password: tms
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    schemas: tms
    default-schema: tms
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: tms

tender:
  documents:
    storage-dir: target/test-uploads
